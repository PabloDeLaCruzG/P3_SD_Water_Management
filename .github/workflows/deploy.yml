name: Build and Push to Docker Hub
on:
  push:
    branches:
      - main # Asegúrate de que coincide con el nombre de tu rama principal
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout del código
      uses: actions/checkout@v3
    - name: Iniciar sesión en Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Construir y subir imagen
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/practica-aws:latest
    # imagen de la Watering Station (Monitor y Engine)
    - name: Construir y subir WS
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./WM_WS/Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/practica-aws:ws
    # imagen del Field Operator
    - name: Construir y subir FO
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./WM_FO/Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/practica-aws:fo